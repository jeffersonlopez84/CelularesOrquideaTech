<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orquidea Tech | Colección vertical</title>
<style>
  :root { --ink: #0a2040; --blue: #1557d2; --blue-deep: #093888; --cyan: #00b6c8; --lime: #d7ff52; --paper: #f6f9fc; --muted: #49617a; }
  * { box-sizing: border-box; }
  @page { size: A4 portrait; margin: 0; }
  html, body { margin: 0; padding: 0; background: #e9f0f8; color: var(--ink); font-family: Arial, Helvetica, sans-serif; }
  .page { width: 210mm; height: 297mm; margin: 0 auto; padding: 11mm 14mm 9mm; overflow: hidden; position: relative; display: flex; flex-direction: column; background: var(--paper); page-break-after: always; break-after: page; }
  .page:last-child { page-break-after: auto; break-after: auto; }
  .top { height: 15mm; flex: 0 0 15mm; margin: -11mm -14mm 7mm; padding: 0 14mm; display: flex; justify-content: space-between; align-items: center; color: #fff; background: linear-gradient(100deg, var(--ink), var(--blue-deep) 65%, var(--blue)); }
  .brand { font-size: 10px; font-weight: 800; letter-spacing: 2.2px; text-transform: uppercase; }
  .number { color: var(--lime); font-size: 11px; font-weight: 800; letter-spacing: 1px; }
  .heading { height: 25mm; flex: 0 0 25mm; display: flex; align-items: center; justify-content: space-between; gap: 4mm; }
  .eyebrow { color: var(--blue); font-size: 8px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 2mm; }
  h1 { margin: 0; font-size: 25px; line-height: 1.05; color: var(--ink); }
  .collection-mark { width: 15mm; height: 15mm; flex: 0 0 15mm; border-radius: 50%; display: grid; place-items: center; color: var(--blue-deep); background: var(--lime); font-size: 9px; font-weight: 900; }
  .photo-wrap { flex: 1; min-height: 0; display: grid; place-items: center; padding: 5mm; overflow: hidden; background: linear-gradient(145deg, #fff, #e7f2fb); border: 1px solid #d5e2ee; border-left: 2.5mm solid var(--cyan); }
  .photo { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; }
  .references { flex: 0 0 auto; padding: 5mm 0 4mm; }
  .reference-label { margin-bottom: 2mm; color: var(--blue); font-size: 8px; font-weight: 900; letter-spacing: 1.8px; text-transform: uppercase; }
  .models { color: var(--ink); font-size: 12px; line-height: 1.5; font-weight: 600; }
  .price { min-height: 22mm; flex: 0 0 22mm; padding: 0 6mm; display: flex; justify-content: space-between; align-items: center; color: white; background: linear-gradient(105deg, var(--blue-deep), var(--blue) 68%, #087fbd); }
  .price-label { font-size: 10px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; color: #dbeaff; }
  .price-value { color: var(--lime); font-size: 27px; font-weight: 900; letter-spacing: .4px; }
  .foot { height: 9mm; flex: 0 0 9mm; display: flex; justify-content: space-between; align-items: end; color: var(--muted); font-size: 8px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; }
  @media screen { .page { margin: 12px auto; box-shadow: 0 8px 30px rgba(10,32,64,.18); } }
  @media print { html, body { background: white; } .page { margin: 0; box-shadow: none; } }
</style>
</head>
<body>
<main id="catalog"></main>
<script>
const root = '../imagenes/';
const designs = [
  { name: 'Sticker Pop', photo: 'Sticker Pop/iPhone 16 Pro.jpeg', models: 'iPhone 13 Pro · iPhone 14 Pro · iPhone 15 Pro Max · iPhone 16 Pro · iPhone 16 Normal · iPhone 17 Pro · iPhone 17 Pro Max', price: 1.75 },
  { name: 'Cuero Bordado Flores', photo: 'Cuero Bordado Flores/iPhone 16 Pro.jpeg', models: 'iPhone 13 Pro · iPhone 14 Pro · iPhone 15 Pro · iPhone 15 Pro Max · iPhone 16 Pro · iPhone 17 Pro Max', price: 1.50 },
  { name: 'Mariposas Glow', photo: 'Mariposas Glow/iPhone 16 Pro.jpeg', models: 'iPhone 13 Pro · iPhone 14 Pro · iPhone 15 Pro Max · iPhone 16 Normal · iPhone 16 Pro · iPhone 17 Pro · iPhone 17 Pro Max', price: 2.00 },
  { name: 'Cute Animals', photo: 'Cute Animals/iPhone 16 Pro.jpeg', models: 'iPhone 13 Normal · iPhone 13 Pro · iPhone 14 Normal · iPhone 14 Pro · iPhone 15 Normal · iPhone 15 Pro Max · iPhone 16 Pro', price: 1.75 },
  { name: 'Sunflower Rainbow', photo: 'Sunflower Rainbow/iPhone 16 Pro Max.jpeg', models: 'iPhone 13 Normal · iPhone 13 Pro Max · iPhone 14 Pro Max · iPhone 15 Pro Max · iPhone 16 Normal · iPhone 16 Pro Max', price: 1.50 },
  { name: 'Metalizado Ondulado', photo: 'Metalizado Ondulado/iPhone 16 Pro Max.jpeg', models: 'iPhone 13 Pro · iPhone 14 Pro Max · iPhone 15 Normal · iPhone 16 Pro Max', price: 2.50 },
  { name: 'Magsafe Premium', photo: 'Magsafe Premium/iPhone 16 Pro.jpeg', models: 'iPhone 13 Pro · iPhone 14 Pro · iPhone 15 Pro · iPhone 16 Pro', price: 2.50 },
  { name: 'Heart Collection', photo: 'Heart Collection/iphone 16 pro.png', models: 'iPhone 13 Pro · iPhone 14 Pro · iPhone 15 Pro · iPhone 16 Pro', price: 2.50 },
  { name: 'Premium Fashion', photo: 'Premium Fashion/iPhone 16 Pro.jpeg', models: 'iPhone 13 Pro · iPhone 14 Pro · iPhone 15 Pro · iPhone 15 Pro Max · iPhone 16 Pro', price: 2.10 },
  { name: 'Spider Stitch Nike', photo: 'Spider Stitch Nike/iPhone 16 Pro.png', models: 'iPhone 13 Pro · iPhone 14 Pro · iPhone 15 Pro · iPhone 15 Pro Max · iPhone 16 Pro · iPhone 17 Pro', price: 1.50 }
];
const encodePath = value => value.split('/').map(encodeURIComponent).join('/');
document.getElementById('catalog').innerHTML = designs.map((item, index) => `<section class="page"><header class="top"><div class="brand">Orquidea Tech</div><div class="number">DISEÑO ${String(index + 1).padStart(2, '0')} / 10</div></header><div class="heading"><div><div class="eyebrow">Colección destacada</div><h1>${item.name}</h1></div><div class="collection-mark">OT</div></div><div class="photo-wrap"><img class="photo" src="${root + encodePath(item.photo)}" alt="Diseño ${item.name}" onerror="this.alt='No se pudo cargar la fotografía';this.style.display='none'"></div><section class="references"><div class="reference-label">Referencias disponibles</div><div class="models">${item.models}</div></section><div class="price"><div class="price-label">Precio por mayor</div><div class="price-value">$${item.price.toFixed(2)}</div></div><footer class="foot"><span>Orquidea Tech · catálogo digital</span><span>Precios en USD</span></footer></section>`).join('');
</script>
</body>
</html>
